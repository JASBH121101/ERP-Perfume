name: Guarded Neon Development migration 0021

on:
  push:
    branches:
      - feature/database-reliability-gate
    paths:
      - .github/workflows/apply-development-migration-0021.yml
  workflow_dispatch:
    inputs:
      confirm_development_only:
        description: Type YES to authorize the guarded Development-only runner
        required: true
        type: choice
        options:
          - NO
          - YES

permissions:
  contents: read

concurrency:
  group: jb-parfums-erp-development-migrations
  cancel-in-progress: false

jobs:
  apply-development:
    if: >-
      github.ref == 'refs/heads/feature/database-reliability-gate' &&
      (github.event_name == 'push' || inputs.confirm_development_only == 'YES')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.ERP_BACKUP_DATABASE_URL }}
      ERP_ENVIRONMENT: development
      ERP_MIGRATION_BRANCH: development
      ERP_MIGRATION_BRANCH_ID: br-nameless-surf-bezeav6n
      ERP_EXPECTED_NEON_ENDPOINT_HOST: ep-lingering-field-bethkduo.c-9.us-east-2.aws.neon.tech
      ERP_MIGRATIONS_APPROVED: YES
      EXPECTED_MIGRATION_SHA256: 2895ae015ab8e42c83956798c674beb57e0e515c4755ee393148cf3f90ab46dc

    steps:
      - name: Checkout guarded feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/database-reliability-gate
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify migration source integrity
        run: npm run check:db

      - name: Require exact Development connection configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MIGRATION_DATABASE_URL:-}" || {
            echo "::error::ERP_BACKUP_DATABASE_URL is not configured."
            exit 1
          }
          test "${ERP_ENVIRONMENT}" = "development"
          test "${ERP_MIGRATION_BRANCH}" = "development"
          test "${ERP_MIGRATION_BRANCH_ID}" = "br-nameless-surf-bezeav6n"
          test "${ERP_EXPECTED_NEON_ENDPOINT_HOST}" = "ep-lingering-field-bethkduo.c-9.us-east-2.aws.neon.tech"
          test "${ERP_MIGRATIONS_APPROVED}" = "YES"

      - name: Run protected live preflight and require migration 0021 only
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          report="$(npm run --silent migrate:db)"
          printf '%s\n' "$report"
          mapfile -t pending < <(
            printf '%s\n' "$report" |
              sed -nE 's/^[[:space:]]*pending ([0-9]{4}) .*/\1/p'
          )
          if [[ "${#pending[@]}" -ne 1 || "${pending[0]}" != "0021" ]]; then
            echo "::error::Refusing to apply: the live plan must contain exactly migration 0021 and no other pending version."
            exit 1
          fi
          echo "The live preflight confirms 0021 is the only pending migration."

      - name: Apply through the repository migration runner
        run: npm run migrate:db:apply

      - name: Independently verify Development schema and migration ledger
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { Pool } from "@neondatabase/serverless";

          const expectedHost = "ep-lingering-field-bethkduo.c-9.us-east-2.aws.neon.tech";
          const expectedChecksum = process.env.EXPECTED_MIGRATION_SHA256;
          const url = new URL(process.env.MIGRATION_DATABASE_URL || "");
          if (url.hostname.toLowerCase() !== expectedHost) {
            throw new Error("Post-apply verification refused a non-Development endpoint.");
          }

          const pool = new Pool({
            connectionString: process.env.MIGRATION_DATABASE_URL,
            max: 1,
            connectionTimeoutMillis: 10000,
            idleTimeoutMillis: 5000
          });

          try {
            const result = await pool.query(`
              SELECT
                current_database() AS database_name,
                current_user AS role_name,
                to_regclass('public.inventory_movement_single_reversal_uq') IS NOT NULL AS reversal_index,
                EXISTS (
                  SELECT 1
                  FROM pg_trigger t
                  JOIN pg_class c ON c.oid = t.tgrelid
                  WHERE c.oid = 'public.inventory_movements'::regclass
                    AND t.tgname = 'inventory_movements_append_only'
                    AND NOT t.tgisinternal
                    AND t.tgenabled <> 'D'
                ) AS append_only_trigger,
                to_regprocedure('public.prevent_inventory_movement_mutation()') IS NOT NULL AS guard_function,
                EXISTS (
                  SELECT 1 FROM public.permission_catalog
                  WHERE permission_key = 'inventory.movements.reverse'
                ) AS reversal_permission,
                EXISTS (
                  SELECT 1 FROM public.role_template_permissions
                  WHERE role_key = 'admin'
                    AND permission_key = 'inventory.movements.reverse'
                    AND allowed = TRUE
                ) AS admin_default_grant,
                EXISTS (
                  SELECT 1 FROM public.app_schema_migrations
                  WHERE version = '0021'
                    AND filename = '0021_inventory_movement_reversals.sql'
                    AND checksum = $1
                ) AS ledger_checksum
            `, [expectedChecksum]);

            const row = result.rows[0];
            const identityOk = row.database_name === "erp_perfume" && row.role_name === "erp_owner";
            const checks = [
              ["database and owner identity", identityOk],
              ["unique reversal index", row.reversal_index],
              ["enabled append-only trigger", row.append_only_trigger],
              ["mutation guard function", row.guard_function],
              ["granular reversal permission", row.reversal_permission],
              ["admin default grant", row.admin_default_grant],
              ["0021 ledger filename and SHA-256", row.ledger_checksum]
            ];

            for (const [name, passed] of checks) {
              console.log((passed ? "PASS " : "FAIL ") + name);
            }
            if (checks.some(([, passed]) => !passed)) {
              throw new Error("Post-apply schema verification did not pass every invariant.");
            }
          } finally {
            await pool.end();
          }
          NODE

      - name: Confirm the migration runner reports no pending Development migrations
        shell: bash
        run: |
          set -euo pipefail
          report="$(npm run --silent migrate:db)"
          printf '%s\n' "$report"
          if printf '%s\n' "$report" | grep -Eq '^[[:space:]]*pending [0-9]{4} '; then
            echo "::error::The post-apply migration plan still contains pending migrations."
            exit 1
          fi
          echo "Development migration ledger is current."
