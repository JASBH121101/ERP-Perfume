name: Deploy JB PARFUMS Development API Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/src/**"
      - "worker/wrangler.toml"
      - "wrangler.toml"
      - "scripts/build.mjs"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jb-parfums-development-api-worker
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate and deploy Development API
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ddfbc84938d4d2795dd70d524b4197c9
      API_URL: https://jb-parfums-erp-api.jaredblancoh19.workers.dev
      PREVIEW_URL: https://wrangler-preview.erp-perfume.pages.dev
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned ERP dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Development-only target
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^ERP_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^name = "jb-parfums-erp-api"$' wrangler.toml
          echo "Worker configuration is pinned to jb-parfums-erp-api / Neon Development."

      - name: Validate source, build and unit tests
        run: |
          set -euo pipefail
          node --check assets/js/bootstrap.mjs
          node --check assets/js/app.js
          node --input-type=module --check < worker/src/index.js
          node --input-type=module --check < worker/src/erp.js
          node --input-type=module --check < worker/src/permissions.js
          npm run build
          npm run test:unit

      - name: Confirm Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The existing CLOUDFLARE_API_TOKEN Actions secret is unavailable."
            exit 1
          fi
          echo "Cloudflare API token is present."

      - name: Diagnose Cloudflare Worker access using the GitHub secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4"
          probe() {
            local label="$1"
            local path="$2"
            local body="$RUNNER_TEMP/cf-probe-$3.json"
            local status
            status="$(curl --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -o "$body" -w "%{http_code}" "$base$path")"
            echo "Cloudflare probe: $label (HTTP $status)"
            node --input-type=module - "$body" <<'NODE'
          import { readFileSync } from "node:fs";
          const raw = readFileSync(process.argv[2], "utf8");
          try {
            const data = JSON.parse(raw);
            console.log(JSON.stringify({
              success: data.success,
              errors: (data.errors || []).map(({code,message}) => ({code,message})),
              workerNames: Array.isArray(data.result) ? data.result.map(x => x.id).filter(Boolean) : undefined
            }));
          } catch {
            console.log("Response is non-JSON; body intentionally not printed.");
          }
          NODE
          }
          probe "list Workers scripts" "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" "list"
          probe "read existing Worker script" "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/jb-parfums-erp-api" "script"
          probe "read Worker service environment settings" "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/jb-parfums-erp-api/environments/production/settings" "settings"
          probe "inspect Wrangler service endpoint" "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/jb-parfums-erp-api" "service"

      - name: Deploy Development Worker with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml

      - name: Verify Development Worker, Neon and R2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            "$API_URL/api/health" \
            -H "Origin: $PREVIEW_URL" \
            -o "$RUNNER_TEMP/health.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const data = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/health.json", "utf8"));
          if (data.ok !== true) throw new Error("Worker health endpoint did not return ok=true.");
          if (data.services?.database !== true) throw new Error("Neon Development connectivity failed.");
          if (data.services?.authentication !== true) throw new Error("Neon Auth configuration is missing.");
          if (data.services?.storage !== true) throw new Error("Cloudflare R2 binding is missing.");
          if (data.environment !== "development") throw new Error("Worker is not pinned to Development.");
          console.log("Development API smoke test passed:", JSON.stringify(data));
          NODE

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## JB PARFUMS Development API Worker"
            echo "- Target: **Neon Development only**"
            echo "- Worker: jb-parfums-erp-api"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Production deployment: **not performed**"
          } >> "$GITHUB_STEP_SUMMARY"
