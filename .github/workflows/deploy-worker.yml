name: Validate JB PARFUMS API Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/src/**"
      - "worker/wrangler.toml"
      - "wrangler.toml"
      - "scripts/build.mjs"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jb-parfums-api-worker-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate Development API source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned ERP dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Development target
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^ERP_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^name = "jb-parfums-erp-api"$' wrangler.toml
          echo "Worker configuration is pinned to jb-parfums-erp-api / Development."

      - name: Validate source, build and unit tests
        run: |
          set -euo pipefail
          node --check assets/js/bootstrap.mjs
          node --check assets/js/app.js
          node --input-type=module --check < worker/src/index.js
          node --input-type=module --check < worker/src/erp.js
          node --input-type=module --check < worker/src/permissions.js
          npm run build
          npm run test:unit

      - name: Write validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## JB PARFUMS API Worker validation"
            echo "- Result: source/build/unit-test validation only"
            echo "- Target configuration: Neon Development"
            echo "- Source commit: $GITHUB_SHA"
            echo "- No Cloudflare secrets required by this validation workflow."
            echo "- No deployment or Production change was performed."
          } >> "$GITHUB_STEP_SUMMARY"
