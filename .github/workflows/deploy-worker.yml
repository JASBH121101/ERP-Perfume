name: Deploy JB PARFUMS API Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jb-parfums-api-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy standalone API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned ERP dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/bootstrap.mjs
          node --check assets/js/app.js
          node --input-type=module --check < worker/src/index.js
          echo "Frontend and Worker JavaScript syntax checks passed."

      - name: Validate frontend build
        run: npm run build

      - name: Check Cloudflare deployment secret
        id: cloudflare-secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Worker deployment skipped. Add CLOUDFLARE_API_TOKEN to repository Actions secrets, then rerun this workflow."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Worker to Cloudflare
        if: steps.cloudflare-secret.outputs.skip != 'true'
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        working-directory: worker
        run: |
          token="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          if [ -z "$token" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty after whitespace normalization. Re-copy the token in Cloudflare and replace the GitHub Actions secret."
            exit 1
          fi
          echo "::add-mask::$token"
          export CLOUDFLARE_API_TOKEN="$token"
          npm install --global wrangler@4
          wrangler deploy
