name: Deploy JB PARFUMS Production API Worker

on:
  push:
    branches: [main]
    paths:
      - ".deployment/worker-production"
      - ".deployment/worker-production-release"

permissions:
  contents: read

concurrency:
  group: jb-parfums-production-api-worker
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate and deploy Production API
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ddfbc84938d4d2795dd70d524b4197c9
      API_URL: https://jb-parfums-erp-api-production.jaredblancoh19.workers.dev
      PRODUCTION_URL: https://erp-perfume.pages.dev

    steps:
      - name: Check out the approved main revision
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned ERP dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Production-only Worker configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^name = "jb-parfums-erp-api-production"$' wrangler.production.toml
          grep -q '^ERP_ENVIRONMENT = "production"$' wrangler.production.toml
          grep -q 'ep-snowy-surf-ber3pjus.c-9.us-east-2.aws.neon.tech' wrangler.production.toml
          ! grep -q 'ep-lingering-field-bethkduo' wrangler.production.toml
          grep -q '^bucket_name = "erp-perfume-assets"$' wrangler.production.toml
          echo "Worker target is pinned to Neon Production and the production API name."

      - name: Validate source, build and unit tests
        run: |
          set -euo pipefail
          node --check assets/js/bootstrap.mjs
          node --check assets/js/app.js
          node --input-type=module --check < worker/src/index.js
          node --input-type=module --check < worker/src/erp.js
          node --input-type=module --check < worker/src/permissions.js
          npm run build
          npm run test:unit

      - name: Preflight existing Production Worker and Neon connection
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            "$API_URL/api/health" \
            -H "Origin: $PRODUCTION_URL" \
            -o "$RUNNER_TEMP/production-preflight.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const data = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/production-preflight.json", "utf8"));
          if (data.ok !== true || data.environment !== "production") {
            throw new Error("Existing Worker is not healthy and pinned to Production.");
          }
          if (data.services?.database !== true || data.services?.authentication !== true || data.services?.storage !== true) {
            throw new Error("Production Neon, Auth, or R2 is not healthy; refusing deployment.");
          }
          console.log("Production preflight passed:", JSON.stringify(data));
          NODE

      - name: Confirm Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The existing CLOUDFLARE_API_TOKEN Actions secret is unavailable."
            exit 1
          fi
          echo "Cloudflare API token is present."

      - name: Deploy Production Worker with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config wrangler.production.toml

      - name: Verify Production Worker, Neon, Auth, R2 and CORS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            "$API_URL/api/health" \
            -H "Origin: $PRODUCTION_URL" \
            -D "$RUNNER_TEMP/production-health.headers" \
            -o "$RUNNER_TEMP/production-health.json"
          grep -iqF "access-control-allow-origin: $PRODUCTION_URL" "$RUNNER_TEMP/production-health.headers"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const data = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/production-health.json", "utf8"));
          if (data.ok !== true || data.environment !== "production") {
            throw new Error("Production Worker identity/health check failed.");
          }
          if (data.services?.database !== true || data.services?.authentication !== true || data.services?.storage !== true) {
            throw new Error("One or more Production services are not healthy.");
          }
          console.log("Production API smoke test passed:", JSON.stringify(data));
          NODE

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## JB PARFUMS Production API Worker"
            echo "- Target: **Neon Production only**"
            echo "- Worker: **jb-parfums-erp-api-production**"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Production Pages: $PRODUCTION_URL"
          } >> "$GITHUB_STEP_SUMMARY"
