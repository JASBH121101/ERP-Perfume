name: ERP Actions diagnostic
on:
  push:
    branches:
      - "feature/erp-procurement-finance-catalog"
    paths:
      - ".github/workflows/erp-actions-diagnostic.yml"

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Minimal runner connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify the GitHub-hosted runner
        run: |
          echo "ERP Actions runner is available."
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          node --version
          npm --version
