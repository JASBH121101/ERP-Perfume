name: ERP Actions diagnostic
on:
  push:
    branches:
      - "feature/erp-procurement-finance-catalog"
    paths:
      - ".github/workflows/erp-actions-diagnostic.yml"

permissions:
  contents: read

jobs:
  validate-workflow:
    name: Validate ERP workflow definition
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Validate ui-checks workflow
        run: |
          "$(go env GOPATH)/bin/actionlint" -color .github/workflows/ui-checks.yml
