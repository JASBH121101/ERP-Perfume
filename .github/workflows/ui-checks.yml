name: ERP quality gate

on:
  push:
    branches:
      - main
      - feat/erp-operational-modules
      - feature/granular-permissions
    paths:
      - "index.html"
      - "README.md"
      - "docs/**"
      - "assets/**"
      - "functions/**"
      - "worker/**"
      - "db/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "jb-expert-qa.config.json"
      - "wrangler.toml"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "index.html"
      - "README.md"
      - "docs/**"
      - "assets/**"
      - "functions/**"
      - "worker/**"
      - "db/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "jb-expert-qa.config.json"
      - "wrangler.toml"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: erp-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Static, unit and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned ERP dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Validate Worker module syntax
        run: |
          node --input-type=module --check < worker/src/index.js
          node --input-type=module --check < worker/src/erp.js
          node --input-type=module --check < worker/src/permissions.js

      - name: Run build, static checks, unit tests and E2E
        run: bash scripts/run-validation.sh


      - name: Upload Playwright visual evidence
        if: always() && hashFiles('visual-evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: erp-playwright-visual-evidence
          path: visual-evidence/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload deterministic test log
        if: always() && hashFiles('.ai-output/validation.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: erp-validation-log
          path: .ai-output/validation.log
          retention-days: 7
          if-no-files-found: ignore

      # Keep the committed dependency graph reproducible after package overrides.
      # Only same-repository PR branches are writable; forks remain read-only.
      - name: Persist resolved npm lockfile to same-repository review branch
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const branch = context.payload.pull_request.head.ref;
            const path = 'package-lock.json';
            const content = fs.readFileSync(path);
            let current = null;

            try {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (Array.isArray(response.data) || response.data.type !== 'file') {
                throw new Error('package-lock.json did not resolve to a single file.');
              }
              current = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (current && Buffer.from(current.content, 'base64').equals(content)) {
              core.info('Committed package-lock.json already matches the resolved dependency graph.');
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              message: 'chore(deps): sync lockfile with reviewed overrides',
              content: content.toString('base64'),
              ...(current ? { sha: current.sha } : {})
            });
            core.notice('Updated package-lock.json on the same-repository review branch.');
