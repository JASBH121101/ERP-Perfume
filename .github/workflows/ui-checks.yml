name: ERP quality gate

on:
  push:
    branches:
      - main
      - feat/erp-operational-modules
      - feature/granular-permissions
    paths:
      - "index.html"
      - "README.md"
      - "docs/**"
      - "assets/**"
      - "functions/**"
      - "worker/**"
      - "db/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "jb-expert-qa.config.json"
      - "wrangler.toml"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "index.html"
      - "README.md"
      - "docs/**"
      - "assets/**"
      - "functions/**"
      - "worker/**"
      - "db/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "jb-expert-qa.config.json"
      - "wrangler.toml"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: erp-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Static, unit and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned ERP dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Validate Worker module syntax
        run: |
          node --input-type=module --check < worker/src/index.js
          node --input-type=module --check < worker/src/erp.js
          node --input-type=module --check < worker/src/permissions.js

      - name: Run build, static checks, unit tests and E2E
        run: bash scripts/run-validation.sh

      - name: Upload deterministic test log
        if: always() && hashFiles('.ai-output/validation.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: erp-validation-log
          path: .ai-output/validation.log
          retention-days: 7
          if-no-files-found: ignore
