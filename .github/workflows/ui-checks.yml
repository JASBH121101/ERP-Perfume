name: ERP quality gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "index.html"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "playwright.config.mjs"
      - ".github/workflows/**"

concurrency:
  group: erp-quality-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-ui:
    name: Static and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout pull request code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned browser-test dependency
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run all deterministic checks
        run: bash scripts/run-validation.sh

      - name: Upload text-only validation log for optional AI diagnosis
        if: always() && hashFiles('.ai-output/validation.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: qa-validation-log
          path: .ai-output/validation.log
          retention-days: 1
          if-no-files-found: ignore


  ai-repair:
    name: Supervised AI repair (optional)
    needs:
      - validate-ui
    if: >-
      ${{ failure() && needs.validate-ui.result == 'failure' &&
          vars.AI_REPAIR_ENABLED == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the exact failed pull request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download text-only validation log
        uses: actions/download-artifact@v4
        with:
          name: qa-validation-log
          path: .ai-output


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned browser-test dependency
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Ask the text-only QA agent for one low-risk repair
        id: ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node scripts/ai-repair.mjs

      - name: Validate AI patch allowlist
        if: steps.ai.outputs.patch_created == 'true'
        run: node scripts/validate-ai-patch.mjs .ai-output/repair.patch

      - name: Apply AI patch
        if: steps.ai.outputs.patch_created == 'true'
        run: |
          git apply --check --whitespace=error .ai-output/repair.patch
          git apply --whitespace=error .ai-output/repair.patch

      - name: Re-run the entire test suite after the proposed repair
        if: steps.ai.outputs.patch_created == 'true'
        run: bash scripts/run-validation.sh

      - name: Create a separate draft pull request only if every test passes
        if: steps.ai.outputs.patch_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git diff --check
          if [ -z "$(git status --porcelain)" ]; then
            echo "No code changes remain after validation."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          AI_BRANCH="ai-fix/pr-${PR_NUMBER}-run-${RUN_ID}"
          git checkout -b "$AI_BRANCH"
          git add -- index.html assets/css/styles.css assets/js/app.js
          git commit -m "fix(ai): low-risk UI repair for PR #${PR_NUMBER}"
          gh auth setup-git --hostname github.com
          git push origin "$AI_BRANCH"

          gh pr create \
            --repo "$GH_REPO" \
            --base "$BASE_BRANCH" \
            --head "$AI_BRANCH" \
            --draft \
            --title "fix(ai): validated UI repair for PR #${PR_NUMBER}" \
            --body "Automated low-risk UI repair proposal.

          - Restricted to HTML, CSS and browser-side JavaScript.
          - No images, databases, storage, credentials or production systems accessed.
          - Patch passed the allowlist validator.
          - Full static and browser test suite passed again after the patch.

          Human review is required. This PR is not merged automatically."

  jb-expert-qa:
    name: JB Expert QA — deterministic source audit
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout exact ERP pull request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify private QA repository token is configured
        env:
          JBQA_REPO_READ_TOKEN: ${{ secrets.JBQA_REPO_READ_TOKEN }}
        run: |
          if [ -z "$JBQA_REPO_READ_TOKEN" ]; then
            echo "::error::Missing JBQA_REPO_READ_TOKEN. Add the fine-grained read-only token to ERP-Perfume Actions secrets."
            exit 1
          fi

      - name: Checkout pinned JB Expert QA engine
        uses: actions/checkout@v4
        with:
          repository: JASBH121101/JB-Expert-QA
          ref: 2833c195d658461564abee0a8c8fb615777a9658
          token: ${{ secrets.JBQA_REPO_READ_TOKEN }}
          path: .jb-expert-qa
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create clean ERP source snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/erp-project"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/erp-project"

      - name: Run JB Expert QA local static audit
        id: jbqa-audit
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/jb-expert-qa-report"
          node .jb-expert-qa/src/project-cli.js "$RUNNER_TEMP/erp-project" \
            --format=json \
            --output="$RUNNER_TEMP/jb-expert-qa-report/report.json"
          node .jb-expert-qa/src/project-cli.js "$RUNNER_TEMP/erp-project" \
            --format=markdown \
            --output="$RUNNER_TEMP/jb-expert-qa-report/report.md"

      - name: Upload JB Expert QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jb-expert-qa-report
          path: ${{ runner.temp }}/jb-expert-qa-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Enforce critical findings and scan completeness
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/jb-expert-qa-report/report.json
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          let report;
          try {
            report = JSON.parse(readFileSync(process.env.REPORT_PATH, "utf8"));
          } catch {
            console.error("JB Expert QA did not produce a readable JSON report.");
            process.exit(1);
          }

          const critical = (report.diagnostics ?? []).filter((item) => item.severity === "critical");
          const ruleErrors = (report.execution ?? []).filter((item) => item.status !== "passed");
          const complete = report.analysisScope?.complete === true;
          const score = report.scoring?.score;
          const minimum = report.scoring?.minimumScore;

          console.log("JB Expert QA version:", report.version ?? "unknown");
          console.log("Files analyzed:", report.analysisScope?.filesAnalyzed ?? 0);
          console.log("Findings:", report.summary?.findings ?? 0);
          console.log("Score:", score ?? "not calculated", "/", minimum ?? "n/a");
          console.log("Critical findings:", critical.length);
          console.log("Rule execution errors:", ruleErrors.length);
          console.log("Scan complete:", complete);

          await import("node:fs").then(({ appendFileSync }) => {
            const lines = [
              "### JB Expert QA",
              "",
              `- Engine: ${report.version ?? "unknown"}`,
              `- Files analyzed: ${report.analysisScope?.filesAnalyzed ?? 0}`,
              `- Findings: ${report.summary?.findings ?? 0}`,
              `- Score: ${score ?? "n/a"}/${minimum ?? "n/a"}`,
              `- Critical findings: ${critical.length}`,
              `- Scan complete: ${complete ? "yes" : "no"}`,
              ""
            ].join("\n");
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines);
          });

          if (!complete || critical.length > 0 || ruleErrors.length > 0) {
            console.error("JB Expert QA blocked this check: incomplete scan, critical finding, or rule execution error.");
            process.exit(1);
          }

          if (report.scoring?.passed !== true) {
            console.warn("Score is below the configured threshold. This is advisory during initial baseline calibration; critical findings and incomplete scans remain blocking.");
          }

          console.log("JB Expert QA gate passed.");
          NODE
